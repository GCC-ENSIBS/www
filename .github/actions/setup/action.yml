name: Setup
description: Installs pnpm, Node and the locked dependencies.

runs:
  using: composite
  steps:
    # Reads the pnpm version from the packageManager field of package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    # Kept in step with the engines field of package.json.
    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    # pnpm-lock.yaml is git ignored, so the committed copy cannot follow
    # package.json and the tree is resolved at install time. Only the exact
    # versions pinned in package.json are guaranteed here; transitive ones are
    # whatever resolves on the day. Dropping the lockfile from .gitignore is
    # what would make this reproducible again.
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile
      shell: bash
