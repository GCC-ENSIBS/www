---
name: Audit the project
on: [push, pull_request]
permissions:
  contents: read
# push and pull_request both fire on a pull request branch. Without this, two
# runs race to build the same database and neither benefits from the other.
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npm-audit:
    name: Audit with npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # No version here: the action reads packageManager from package.json, and
      # throws when the two disagree.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true
      # pnpm-lock.yaml is git ignored, so the committed copy cannot follow
      # package.json and a frozen install would fail.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit
  dependency-check:
    name: Audit with dependency-check
    runs-on: ubuntu-latest
    # Generous enough for the cold run that builds the database from scratch,
    # tight enough that a stalled NVD call does not idle for hours.
    timeout-minutes: 45
    env:
      # The matching archive is committed at the root of the repository, so
      # bumping this means committing the new release zip and deleting the old.
      DEPENDENCY_CHECK_VERSION: 12.1.0
      REPORT_DIR: dependency-check-report
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      # Installed so the scan sees the tree that actually ships, rather than
      # the handful of direct dependencies declared in package.json.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Stamp the day
        id: day
        run: echo "stamp=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # Keyed by the day, not by the run: the database weighs more than a
      # gigabyte, and a fresh entry per run would burn through the 10 GB a
      # repository gets for caches, evicting the other workflows' entries with
      # it. One entry a day pairs with the 24 hour freshness window below, so
      # only the first run of the day talks to the NVD at all.
      - name: Restore the vulnerability database
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-data-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ steps.day.outputs.stamp }}
          restore-keys: |
            dependency-check-data-${{ env.DEPENDENCY_CHECK_VERSION }}-
      # Unpacked from the archive committed at the root of the repository, and
      # unpacked outside the workspace: dependency-check ships its own jars, so
      # scanning them would report the scanner's dependencies as ours.
      - name: Unpack dependency-check
        run: |
          archive="dependency-check-$DEPENDENCY_CHECK_VERSION-release.zip"

          if [ ! -f "$archive" ]; then
            echo "::error::$archive is missing from the repository root. Download it from https://github.com/jeremylong/DependencyCheck/releases/tag/v$DEPENDENCY_CHECK_VERSION and commit it."
            exit 1
          fi

          unzip -q "$archive" -d "$RUNNER_TEMP"
      - name: Scan the project
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # The default heap is a quarter of the runner's memory, which the H2
          # database and a few thousand node_modules files can outgrow.
          JAVA_OPTS: -Xmx4g
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::NVD_API_KEY is not set, and the NVD throttles anonymous access heavily. Request a key at https://nvd.nist.gov/developers/request-an-api-key and add it to the repository secrets."
          fi

          # Neither directory is created by the tool: it rejects an --out path
          # that does not already exist, and validates that before scanning.
          mkdir -p "$REPORT_DIR" "$RUNNER_TEMP/dependency-check-data"

          # Analysers for ecosystems this project does not use. Disabling them
          # keeps the scan quick and stops analysers from failing over tools
          # that are simply not installed on the runner.
          unused=(
            --disableAssembly --disableMSBuild --disableNuspec --disableNugetconf
            --disableJar --disableCentral --disableCentralCache --disableMavenInstall
            --disableRubygems --disableBundleAudit
            --disablePip --disablePipfile --disablePyDist --disablePyPkg --disablePoetry
            --disableGolangDep --disableGolangMod
            --disableCocoapodsAnalyzer --disableCarthageAnalyzer
            --disableSwiftPackageManagerAnalyzer --disableSwiftPackageResolvedAnalyzer
            --disableCmake --disableAutoconf --disableComposer --disableCpan
            --disableDart --disableMixAudit --disableOpenSSL
            --disableYarnAudit
            # Belt and braces with the exclude below: the scanner archive now
            # sits in the workspace, and nothing here ships inside an archive.
            --disableArchive
            # One remote call per package against a rate limited anonymous
            # endpoint, for npm advisories the pnpm analyser already reports.
            --disableOssIndex --disableOssIndexCache
          )

          # The pnpm analyser reads pnpm-lock.yaml natively, so no npm lockfile
          # has to be forged for this project.
          "$RUNNER_TEMP/dependency-check/bin/dependency-check.sh" \
            --project "${{ github.event.repository.name }}" \
            --scan . \
            --exclude "**/.git/**" \
            --exclude "**/dist/**" \
            --exclude "**/src/assets/**" \
            --exclude "**/dependency-check-*-release.zip" \
            --out "$REPORT_DIR" \
            --format HTML \
            --format JSON \
            --data "$RUNNER_TEMP/dependency-check-data" \
            --nvdValidForHours 24 \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"} \
            "${unused[@]}"
      # Puts the headline numbers on the run page, so the artifact only has to
      # be opened when there is something to look at.
      - name: Summarise the findings
        if: always()
        run: |
          report="$REPORT_DIR/dependency-check-report.json"

          if [ ! -f "$report" ]; then
            echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Dependency-check"
            echo
            jq -r '
              [.dependencies[]? | select(.vulnerabilities)] as $flagged
              | "Scanned \(.dependencies | length) dependencies, \($flagged | length) carrying a known vulnerability."
            ' "$report"
            echo

            severities=$(jq -r '
              [.dependencies[]?.vulnerabilities[]? | .severity // "UNKNOWN"]
              | group_by(.) | map("- \(.[0]): \(length)") | join("\n")
            ' "$report")

            if [ -n "$severities" ]; then
              echo "$severities"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: ${{ env.REPORT_DIR }}
          retention-days: 30
          if-no-files-found: warn
