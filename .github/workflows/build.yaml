name: Build the project
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Build with Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11'
          standalone: true
      - name: Install dependencies
        run: pnpm install
      - name: Build project
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
